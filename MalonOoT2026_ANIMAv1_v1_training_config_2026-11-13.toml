pretrained_model_name_or_path = "/anima_trainer/models/anima/dit/anima-base-v1.0.safetensors"
qwen3 = "/anima_trainer/models/anima/text_encoder/qwen_3_06b_base.safetensors"
vae = "/anima_trainer/models/anima/vae/qwen_image_vae.safetensors"
network_module = "networks.lora_anima"
network_dim = 30
network_alpha = 30
network_train_unet_only = true
learning_rate = 0.0001
optimizer_type = "AdamW8bit"
optimizer_args = [ "weight_decay=0.1", "betas=[0.9, 0.99]",]
lr_scheduler = "cosine_with_restarts"
lr_scheduler_num_cycles = 1
lr_warmup_steps = 100
max_train_epochs = 10
train_batch_size = 1
gradient_accumulation_steps = 1
max_grad_norm = 1.0
seed = 42
timestep_sampling = "sigmoid"
discrete_flow_shift = 1.0
qwen3_max_token_length = 512
t5_max_token_length = 512
mixed_precision = "bf16"
gradient_checkpointing = true
cache_latents = true
cache_text_encoder_outputs = true
vae_chunk_size = 64
vae_disable_cache = true
output_name = "MalonOoT2026_ANIMAv1_v1"
save_model_as = "safetensors"
save_precision = "bf16"
save_every_n_epochs = 1
save_last_n_epochs = 4
shuffle_caption = false
caption_extension = ".txt"
noise_offset = 0.03
multires_noise_discount = 0.3

[[datasets]]
resolution = 768
[[datasets.subsets]]
num_repeats = 8
image_dir = "/lora_training/datasets/MalonOoT2026_ANIMAv1_v1"
caption_extension = ".txt"
caption_dropout_rate = 0.1

[general]
resolution = 768
enable_bucket = true
bucket_no_upscale = false
bucket_reso_steps = 64
min_bucket_reso = 256
max_bucket_reso = 4096
